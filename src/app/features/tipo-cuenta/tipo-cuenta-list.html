<div class="toolbar">
  <button mat-raised-button color="primary" (click)="nuevo()">
    Nuevo tipo de cuenta
  </button>
</div>

<div *ngIf="loading" class="loading">
  <mat-spinner></mat-spinner>
</div>

<table mat-table [dataSource]="dataSource" *ngIf="!loading">

  <!-- ID -->
  <ng-container matColumnDef="id_tipo_cuenta">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let row">{{ row.id_tipo_cuenta }}</td>
  </ng-container>

  <!-- Código -->
  <ng-container matColumnDef="codigo">
    <th mat-header-cell *matHeaderCellDef>Código</th>
    <td mat-cell *matCellDef="let row">{{ row.codigo }}</td>
  </ng-container>

  <!-- Nombre -->
  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
  </ng-container>

  <!-- Usuario creación -->
  <ng-container matColumnDef="id_usuario_creacion">
    <th mat-header-cell *matHeaderCellDef>Creado por</th>
    <td mat-cell *matCellDef="let row">{{ row.id_usuario_creacion }}</td>
  </ng-container>

  <!-- Acciones -->
  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let row">
      <button mat-icon-button color="primary" (click)="editar(row)">
        <mat-icon>edit</mat-icon>
      </button>

      <button mat-icon-button color="warn" (click)="eliminar(row)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

<mat-paginator [pageSize]="5"></mat-paginator>
