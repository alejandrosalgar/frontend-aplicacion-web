<div class="toolbar">
  <button mat-raised-button color="primary" (click)="nuevo()">
    Nueva cuenta
  </button>
</div>

<div *ngIf="loading" class="loading">
  <mat-spinner></mat-spinner>
</div>

<table mat-table [dataSource]="dataSource" *ngIf="!loading">

  <!-- ID -->
  <ng-container matColumnDef="id_cuenta">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let row">{{ row.id_cuenta }}</td>
  </ng-container>

  <!-- Número -->
  <ng-container matColumnDef="numero_cuenta">
    <th mat-header-cell *matHeaderCellDef>Número</th>
    <td mat-cell *matCellDef="let row">{{ row.numero_cuenta }}</td>
  </ng-container>

  <!-- Saldo -->
  <ng-container matColumnDef="saldo">
    <th mat-header-cell *matHeaderCellDef>Saldo</th>
    <td mat-cell *matCellDef="let row">{{ row.saldo }}</td>
  </ng-container>

  <!-- Usuario -->
  <ng-container matColumnDef="id_usuario">
    <th mat-header-cell *matHeaderCellDef>Usuario</th>
    <td mat-cell *matCellDef="let row">{{ row.id_usuario }}</td>
  </ng-container>

  <!-- Sucursal -->
  <ng-container matColumnDef="id_sucursal">
    <th mat-header-cell *matHeaderCellDef>Sucursal</th>
    <td mat-cell *matCellDef="let row">{{ row.id_sucursal }}</td>
  </ng-container>

  <!-- Tipo Cuenta -->
  <ng-container matColumnDef="id_tipo_cuenta">
    <th mat-header-cell *matHeaderCellDef>Tipo</th>
    <td mat-cell *matCellDef="let row">{{ getNombreTipoCuenta(row.id_tipo_cuenta) }}</td>
  </ng-container>

  <!-- Acciones -->
  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let row">
      <button mat-icon-button color="primary" (click)="editar(row)">
        <mat-icon>edit</mat-icon>
      </button>

      <button mat-icon-button color="warn" (click)="eliminar(row)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

<mat-paginator [pageSize]="5"></mat-paginator>
